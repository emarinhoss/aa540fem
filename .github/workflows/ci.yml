name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e "python[mesh,amg,dev]"
      - name: Lint
        run: ruff check python
      - name: Test
        run: python -m pytest python/tests -q
      - name: Run the driver and the annulus example
        run: |
          cd python
          python main.py -o ''
          python examples/annulus.py --mesh examples/annulus_quad9.msh --method cg --no-plot
          python scripts/convergence.py --elems 4 8
          python scripts/convergence.py --transient --dts 0.02 0.01
          python examples/convection_diffusion.py --no-plot
          python examples/rotating_hill.py --no-plot --steps 100 --series ''
          python examples/nonlinear_conduction.py --no-plot
          python examples/cavity.py --no-plot --elems 16 --vtk ''
          python examples/cylinder.py --no-plot --vtk ''
