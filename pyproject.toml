[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aa540fem"
version = "0.2.0"
description = "Finite element solver for 2-D anisotropic heat conduction (AA 540 project, Python port)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.23",
    "scipy>=1.12",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
mesh = ["meshio>=5"]
amg = ["pyamg>=5"]
meshgen = ["gmsh>=4.11"]
numba = ["numba>=0.61"]
petsc = ["petsc4py>=3.19", "mpi4py>=3.1"]
mpi = ["mpi4py>=3.1", "pymetis>=2023.1"]
hw = ["psutil>=5.9", "threadpoolctl>=3", "nvidia-ml-py>=12"]
fast = ["numba>=0.61", "petsc4py>=3.19", "mpi4py>=3.1", "psutil>=5.9", "threadpoolctl>=3"]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["examples/meshes/*.msh", "matlab", "report"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E731"]

[tool.ruff.lint.isort]
known-first-party = ["aa540fem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
